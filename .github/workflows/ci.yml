name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Resolve new AI SDK v6 dependencies (bootstrap lock)
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ "$RUNNER_OS" = "Linux" ]; then
            node -e 'const fs=require("fs"); const s=fs.readFileSync("package-lock.json","utf8"); console.log("LOCK_BEGIN"); for(let i=0;i<s.length;i+=1000) console.log("LOCKPART:"+JSON.stringify(s.slice(i,i+1000))); console.log("LOCK_END")'
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Assert Node 24
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Lint
        run: npm run lint
      - name: Build workspaces
        run: npm run build
      - name: Typecheck tests
        run: npm run typecheck:tests
      - name: Unit and CLI smoke tests
        run: npm test
      - name: Checkout existing gungnir-mcp (pinned)
        uses: actions/checkout@v7
        with:
          repository: justinangeloperez327/gungnir-mcp
          ref: 0ebdf784ab08ff97baffe9965d7de9c7e0a93674
          path: integration/gungnir-mcp
          persist-credentials: false
      - name: Install pinned MCP server dependencies
        working-directory: integration/gungnir-mcp
        run: npm ci --no-audit --no-fund
      - name: Build pinned MCP server
        working-directory: integration/gungnir-mcp
        run: npm run build
      - name: Validate real MCP stdio interoperability
        env:
          GUNGNIR_MCP_SERVER_ENTRY: integration/gungnir-mcp/dist/index.js
        run: npm test -- tests/mcp-client.integration.test.ts
